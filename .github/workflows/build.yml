name: Build & Release SecretFire

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: SecretFire-windows.exe
            dist_file: dist/SecretFire.exe
          - os: ubuntu-22.04
            artifact: SecretFire-linux
            dist_file: dist/SecretFire
          - os: macos-latest
            artifact: SecretFire-macos
            dist_file: dist/SecretFire

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: desktop-app
        run: pip install -r requirements.txt

      - name: Download Tor bundle
        working-directory: desktop-app
        run: python download_tor_bundle.py

      - name: Build with PyInstaller
        working-directory: desktop-app
        run: pyinstaller secretfire.spec

      - name: Rename artifact
        working-directory: desktop-app
        shell: bash
        run: mv ${{ matrix.dist_file }} dist/${{ matrix.artifact }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: desktop-app/dist/${{ matrix.artifact }}
